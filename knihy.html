<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knižnica – knihy</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="knihy.js" defer></script>
</head>
<body>
  <main>
    <h1>Moja knižnica</h1>
    <p>Pridajte knihu do databázy alebo si pozrite zoznam kníh.</p>

    <form id="formular">
      <label for="nazov">Názov knihy</label>
      <input id="nazov" name="nazov" type="text" placeholder="Názov knihy" maxlength="120" required>

      <label for="autor">Autor</label>
      <input id="autor" name="autor" type="text" placeholder="Autor" maxlength="150" required>

      <label for="rok">Rok</label>
      <input id="rok" name="rok" type="number" step="1" placeholder="Rok" required>

      <label for="cena">Cena (€)</label>
      <input id="cena" name="cena" type="number" step="0.01" min="0" placeholder="Cena (€)" required>

      <button type="submit">Pridať knihu</button>
    </form>

    <p id="sprava" class="message" role="status" aria-live="polite"></p>

    <h2>Zoznam kníh</h2>
    <p id="chyba" class="message error" role="alert"></p>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Názov</th>
            <th scope="col">Autor</th>
            <th scope="col">Rok</th>
            <th scope="col">Cena (€)</th>
            <th scope="col">Akcia</th>
          </tr>
        </thead>
        <tbody id="zoznam-knih">
          <tr><td class="empty" colspan="6">Načítavam knihy…</td></tr>
        </tbody>
      </table>
    </div>
    <p><a href="index.html">Späť na katalóg</a></p>
  </main>
</body>
</html>
